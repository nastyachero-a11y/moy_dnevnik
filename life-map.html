<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта жизни — Мой дорогой дневник</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --lime: #a8ff3e;
      --blue: #1e4fd6;
      --green: #2bb673;
      --text: #1a1a2e;
      --soft: #5a6280;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(165deg, #1a3a9c 0%, #1e6fd9 35%, #2bb673 75%, #3dd68c 100%);
      background-attachment: fixed;
      color: white;
      min-height: 100vh;
      line-height: 1.45;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      max-width: 980px;
      margin: 0 auto;
    }
    .back-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
      padding: 9px 14px;
      border-radius: 11px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.25); }
    .page-title { font-size: 1.1rem; font-weight: 800; }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 4px 16px 56px;
    }
    .intro {
      text-align: center;
      margin-bottom: 6px;
      font-size: 1rem;
      font-weight: 600;
      color: rgba(255,255,255,0.92);
    }
    .hint {
      text-align: center;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 12px;
    }
    .map-wrap {
      position: relative;
      width: 100%;
      height: min(72vw, 520px);
      min-height: 380px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: rgba(0,0,0,0.12);
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
    }
    .map-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .map-svg path {
      fill: none;
      stroke: rgba(255,255,255,0.35);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 6 5;
      transition: stroke 0.35s, stroke-width 0.35s;
    }
    .map-svg path.filled {
      stroke: rgba(168,255,62,0.75);
      stroke-width: 2.4;
      stroke-dasharray: none;
    }
    .node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      z-index: 3;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-width: 56px;
      min-height: 56px;
    }
    .node-core {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      color: var(--blue);
      font-weight: 800;
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.15;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      border: 2px solid transparent;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s, background 0.25s;
    }
    .node:hover .node-core {
      transform: scale(1.08);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }
    .node.filled .node-core {
      background: linear-gradient(145deg, #fff, #e8ffe0);
      border-color: var(--lime);
    }
    .node.center .node-core {
      width: 88px;
      height: 88px;
      font-size: 0.95rem;
      background: linear-gradient(145deg, #1e4fd6, #2bb673);
      color: white;
      border: 3px solid rgba(255,255,255,0.5);
      box-shadow: 0 12px 36px rgba(30,79,214,0.35);
      cursor: default;
    }
    .node.center:hover .node-core { transform: none; }
    .node-score {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--lime);
      color: #123;
      font-size: 0.72rem;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .node.filled .node-score { display: flex; }
    .node-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 6px rgba(0,0,0,0.35);
      max-width: 90px;
      text-align: center;
      line-height: 1.2;
    }
    .node.center .node-label { display: none; }

    .summary {
      background: rgba(255,255,255,0.92);
      border-radius: 16px;
      padding: 18px 20px;
      color: var(--text);
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    .summary .count {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 6px;
    }
    .summary .msg {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--soft);
    }
    .summary .msg strong { color: var(--green); }

    .save-status {
      text-align: center;
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--lime);
      opacity: 0;
      transition: opacity 0.3s;
      min-height: 20px;
    }
    .save-status.show { opacity: 1; }

    /* Modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5,12,25,0.55);
      backdrop-filter: blur(6px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .overlay.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      color: var(--text);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: pop 0.28s ease;
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.94) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--blue);
    }
    .modal-close {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.06);
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--soft);
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--soft);
      margin-bottom: 6px;
    }
    .field textarea, .field input {
      width: 100%;
      border: 1.5px solid #e0e4f0;
      border-radius: 12px;
      padding: 11px 13px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      outline: none;
      background: #fafbff;
      resize: vertical;
    }
    .field textarea:focus, .field input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(43,182,115,0.12);
    }
    .field textarea { min-height: 68px; }
    .score-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .score-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1.5px solid #e0e4f0;
      background: #fafbff;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--soft);
      cursor: pointer;
      transition: all 0.15s;
    }
    .score-btn:hover { border-color: var(--green); }
    .score-btn.active {
      background: linear-gradient(135deg, #1e4fd6, #2bb673);
      color: white;
      border-color: transparent;
    }
    .modal-save {
      width: 100%;
      margin-top: 6px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e4fd6, #2bb673);
      color: white;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .modal-save:hover { transform: translateY(-1px); }

    @media (max-width: 600px) {
      .map-wrap { min-height: 460px; height: 500px; }
      .node {
        min-width: 72px;
        min-height: 72px;
        padding: 8px;
      }
      .node-core {
        width: 62px;
        height: 62px;
        font-size: 0.68rem;
        pointer-events: auto;
      }
      .node.center .node-core { width: 80px; height: 80px; font-size: 0.85rem; }
      .node-label { font-size: 0.72rem; max-width: 80px; }
      .add-sphere-btn { margin-top: 8px; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="back-btn">← Назад</a>
    <div class="page-title">Карта жизни</div>
    <div style="width:86px"></div>
  </div>

  <main>
    <p class="intro">В центре — твоя жизнь. Ветки — сферы, которые её составляют</p>
    <p class="hint">Нажми на сферу, чтобы оценить и заполнить</p>

    <div class="map-wrap" id="map">
      <svg class="map-svg" id="branches" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <!-- nodes injected -->
    </div>

    <button type="button" class="add-sphere-btn" id="addSphereBtn">+ Добавить свою сферу</button>

    <div class="summary">
      <div class="msg" id="summaryMsg">Начни с любой ветки — карта соберётся сама</div>
    </div>
    <div class="save-status" id="saveStatus">Сохранено ✓</div>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">Сфера</div>
        <button class="modal-close" id="modalClose" type="button">×</button>
      </div>
      <div class="field">
        <label>Оценка сейчас (1–10)</label>
        <div class="score-row" id="scoreRow"></div>
      </div>
      <div class="field">
        <label>Что есть сейчас</label>
        <textarea id="f-now" placeholder="Как обстоят дела в этой сфере..."></textarea>
      </div>
      <div class="field">
        <label>Чего не хватает</label>
        <textarea id="f-need" placeholder="Что хочется усилить или изменить..."></textarea>
      </div>
      <div class="field">
        <label>Один маленький шаг</label>
        <textarea id="f-step" placeholder="Что могу сделать на этой неделе..."></textarea>
      </div>
      <button class="modal-save" id="modalSave" type="button">Сохранить</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'diary_life_map_v2';
    const CENTER = { x: 50, y: 50 };

    const DEFAULTS = [
      { id: 'health',    name: 'Здоровье',  x: 50, y: 12 },
      { id: 'relations', name: 'Отношения', x: 82, y: 26 },
      { id: 'work',      name: 'Работа',    x: 88, y: 55 },
      { id: 'money',     name: 'Деньги',    x: 72, y: 82 },
      { id: 'rest',      name: 'Отдых',     x: 28, y: 82 },
      { id: 'growth',    name: 'Развитие',  x: 12, y: 55 },
      { id: 'home',      name: 'Дом',       x: 18, y: 26 },
      { id: 'meaning',   name: 'Смысл',     x: 50, y: 90 }
    ];

    let spheres = []; // {id, name, x, y, custom}
    let data = {};    // id -> {score, now, need, step}
    let currentId = null;
    let currentScore = 0;
    let nextCustom = 1;

    function emptyData() {
      return { score: 0, now: '', need: '', step: '' };
    }

    function isFilled(s) {
      if (!s) return false;
      return s.score > 0 || (s.now && s.now.trim()) || (s.need && s.need.trim()) || (s.step && s.step.trim());
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ spheres, data, nextCustom }));
      const el = document.getElementById('saveStatus');
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1400);
    }

    function load() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (raw && Array.isArray(raw.spheres) && raw.spheres.length) {
          spheres = raw.spheres;
          data = raw.data || {};
          nextCustom = raw.nextCustom || 1;
        } else {
          // migrate old format or defaults
          spheres = DEFAULTS.map(s => ({ ...s, custom: false }));
          data = {};
          spheres.forEach(s => { data[s.id] = emptyData(); });
          try {
            const old = JSON.parse(localStorage.getItem('diary_life_map_v1'));
            if (old && old.spheres) {
              Object.keys(old.spheres).forEach(id => {
                if (data[id]) data[id] = { ...data[id], ...old.spheres[id] };
              });
            }
          } catch(e) {}
        }
        spheres.forEach(s => {
          if (!data[s.id]) data[s.id] = emptyData();
        });
      } catch(e) {
        spheres = DEFAULTS.map(s => ({ ...s, custom: false }));
        data = {};
        spheres.forEach(s => { data[s.id] = emptyData(); });
      }
    }

    function branchPath(x1, y1, x2, y2) {
      const dx = x2 - x1, dy = y2 - y1;
      const cx1 = x1 + dx * 0.35;
      const cy1 = y1 + dy * 0.08;
      const cx2 = x1 + dx * 0.65;
      const cy2 = y2 - dy * 0.08;
      return `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`;
    }

    function layoutCustomPositions() {
      // place custom spheres on free angles
      const customs = spheres.filter(s => s.custom);
      customs.forEach((s, i) => {
        if (s.x && s.y && (s.x !== 50 || s.y !== 50)) return;
        const angle = (Math.PI * 2 * i) / Math.max(customs.length, 1) + 0.4;
        const r = 34 + (i % 3) * 4;
        s.x = +(50 + Math.cos(angle) * r).toFixed(1);
        s.y = +(50 + Math.sin(angle) * r).toFixed(1);
      });
    }

    function drawBranches() {
      const svg = document.getElementById('branches');
      svg.innerHTML = '';
      spheres.forEach(s => {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', branchPath(CENTER.x, CENTER.y, s.x, s.y));
        if (isFilled(data[s.id])) path.classList.add('filled');
        svg.appendChild(path);
      });
    }

    function openModal(id) {
      currentId = id;
      const meta = spheres.find(s => s.id === id);
      if (!meta) return;
      const d = data[id] || emptyData();
      currentScore = d.score || 0;
      document.getElementById('modalTitle').textContent = meta.name;
      document.getElementById('f-now').value = d.now || '';
      document.getElementById('f-need').value = d.need || '';
      document.getElementById('f-step').value = d.step || '';
      const row = document.getElementById('scoreRow');
      row.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'score-btn' + (i === currentScore ? ' active' : '');
        b.textContent = i;
        b.addEventListener('click', () => {
          currentScore = i;
          row.querySelectorAll('.score-btn').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
        });
        row.appendChild(b);
      }
      document.getElementById('overlay').classList.add('show');
    }

    function closeModal() {
      document.getElementById('overlay').classList.remove('show');
      currentId = null;
    }

    function renderNodes() {
      layoutCustomPositions();
      const map = document.getElementById('map');
      map.querySelectorAll('.node').forEach(n => n.remove());

      const center = document.createElement('div');
      center.className = 'node center';
      center.style.left = CENTER.x + '%';
      center.style.top = CENTER.y + '%';
      center.innerHTML = '<div class="node-core">Жизнь</div>';
      map.appendChild(center);

      const isMobile = window.matchMedia('(max-width: 600px)').matches;

      spheres.forEach(s => {
        const d = data[s.id] || emptyData();
        const el = document.createElement('div');
        el.className = 'node' + (isFilled(d) ? ' filled' : '') + (s.custom ? ' custom' : '');
        el.style.left = s.x + '%';
        el.style.top = s.y + '%';
        el.dataset.id = s.id;

        const delBtn = s.custom
          ? `<button type="button" class="node-delete${isMobile ? ' show-mobile' : ''}" data-del="${s.id}" aria-label="Удалить">×</button>`
          : '';

        el.innerHTML = `
          <div class="node-core" style="position:relative">
            ${delBtn}
            ${s.name}
            <span class="node-score">${d.score || ''}</span>
          </div>
        `;

        // reliable mobile + desktop open
        const open = (e) => {
          if (e.target.closest && e.target.closest('[data-del]')) return;
          e.preventDefault();
          e.stopPropagation();
          openModal(s.id);
        };
        el.addEventListener('click', open);
        el.addEventListener('touchend', (e) => {
          if (e.target.closest && e.target.closest('[data-del]')) return;
          e.preventDefault();
          openModal(s.id);
        }, { passive: false });

        const del = el.querySelector('[data-del]');
        if (del) {
          const remove = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!confirm('Удалить сферу «' + s.name + '»?')) return;
            spheres = spheres.filter(x => x.id !== s.id);
            delete data[s.id];
            save();
            renderNodes();
          };
          del.addEventListener('click', remove);
          del.addEventListener('touchend', remove, { passive: false });
        }

        map.appendChild(el);
      });

      drawBranches();
      updateSummary();
    }

    function updateSummary() {
      const scored = spheres
        .map(s => ({ name: s.name, score: (data[s.id] && data[s.id].score) || 0 }))
        .filter(s => s.score > 0)
        .sort((a, b) => a.score - b.score);
      const filled = spheres.filter(s => isFilled(data[s.id])).length;
      const msg = document.getElementById('summaryMsg');
      if (filled === 0) {
        msg.textContent = 'Начни с любой ветки — карта соберётся сама';
      } else if (scored.length && scored[0].score <= 5) {
        msg.innerHTML = 'Сейчас мягче всего просится внимание: <strong>' + scored[0].name + '</strong>';
      } else if (filled >= spheres.length) {
        msg.textContent = 'Твоя карта собрана. Ты видишь, где сила и где опора нужна';
      } else {
        msg.textContent = 'Карта растёт. Можно добавить свою сферу или заполнить остальные';
      }
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('overlay').addEventListener('click', e => {
      if (e.target.id === 'overlay') closeModal();
    });
    document.getElementById('modalSave').addEventListener('click', () => {
      if (!currentId) return;
      data[currentId] = {
        score: currentScore,
        now: document.getElementById('f-now').value,
        need: document.getElementById('f-need').value,
        step: document.getElementById('f-step').value
      };
      save();
      renderNodes();
      closeModal();
    });

    document.getElementById('addSphereBtn').addEventListener('click', () => {
      const name = prompt('Название новой сферы:', 'Моя сфера');
      if (!name || !name.trim()) return;
      const id = 'custom_' + (nextCustom++);
      const n = spheres.filter(s => s.custom).length;
      const angle = (Math.PI * 2 * n) / 8 + 0.5;
      const r = 36;
      spheres.push({
        id,
        name: name.trim().slice(0, 18),
        x: +(50 + Math.cos(angle) * r).toFixed(1),
        y: +(50 + Math.sin(angle) * r).toFixed(1),
        custom: true
      });
      data[id] = emptyData();
      save();
      renderNodes();
      // open for fill
      setTimeout(() => openModal(id), 200);
    });

    load();
    renderNodes();
    window.addEventListener('resize', () => renderNodes());
  </script>
</body>
</html>
